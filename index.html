<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b5c">
<link rel="icon" id="fav" href="">
<title>ثانوية نينوى للمتميزين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>

:root{--bg:#f2f5f7;--sf:#fff;--tx:#14283f;--mu:#5b6b7b;--ac:#0f6b5c;--ac2:#c89b2c;--ln:#dbe3e9;--bad:#b3392f;--ok:#1d7a4a;--soft:#e6f2ef;--warn:#fff4dc;--warnt:#7a5410;color-scheme:light}
:root[data-theme="dark"]{--bg:#0e1a26;--sf:#16263a;--tx:#e8eef4;--mu:#9bacbc;--ac:#4fc3ad;--ac2:#e0b84a;--ln:#263a52;--bad:#ef7a6e;--ok:#5fcf93;--soft:#1b3446;--warn:#3a2f17;--warnt:#f0d08a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;line-height:1.7;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:linear-gradient(120deg,#0b4f44,var(--ac));color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
:root[data-theme="dark"] .top{background:linear-gradient(120deg,#0b2e3f,#124a5c)}
.top b{font-family:Amiri,serif;font-size:1.3rem;line-height:1.3;display:block}
.top small{opacity:.9;font-size:.8rem;display:block;line-height:1.4}
.ib{background:transparent;border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:8px;padding:4px 10px;cursor:pointer;flex:none}
main{max-width:760px;margin:0 auto;padding:14px}
h2{font-size:1.15rem;margin:4px 0 12px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
h3{font-size:1rem;margin:0 0 8px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.wr{flex-wrap:wrap}
.f1{flex:1;min-width:0}
.mu{color:var(--mu);font-size:.86rem}
.tag{display:inline-block;background:var(--ac);color:#fff;border-radius:6px;padding:0 8px;font-size:.76rem;margin-inline-end:6px;white-space:nowrap}
.tag.g{background:var(--ac2);color:#2b1f00}.tag.r{background:var(--bad)}.tag.o{background:var(--ok)}.tag.s{background:var(--soft);color:var(--tx)}
.done .t{text-decoration:line-through;opacity:.55}
.chk{width:24px;height:24px;accent-color:var(--ac);flex:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ac2);flex:none}
.nav{position:fixed;bottom:0;inset-inline:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.nav button{flex:1;background:none;border:0;padding:8px 2px 10px;cursor:pointer;color:var(--mu);font-weight:600;font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.3}
.nav button i{font-style:normal;font-size:1.25rem}
.nav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}
.badge{background:var(--bad);color:#fff;border-radius:10px;font-size:.7rem;padding:0 6px;margin-inline-start:4px;font-style:normal}
.seg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.seg button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--ln);background:var(--sf);cursor:pointer;font-weight:600;min-width:70px}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.lo{background:var(--bad)}
.sum{background:var(--ac);color:#fff;border-radius:12px;padding:14px;margin-bottom:12px;text-align:center}
:root[data-theme="dark"] .sum{color:#06231d}
.sum strong{font-size:1.9rem;display:block;line-height:1.2}
label{font-size:.85rem;color:var(--mu);display:block;margin-bottom:2px}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);margin-bottom:8px}
textarea{min-height:76px;resize:vertical}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:700;width:100%}
:root[data-theme="dark"] .btn{color:#06231d}
.btn.sm{width:auto;padding:5px 12px;font-size:.85rem}
.btn.alt{background:var(--soft);color:var(--tx)}
.btn.gold{background:var(--ac2);color:#2b1f00}
.btn:disabled{opacity:.5;cursor:not-allowed}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.login{max-width:400px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top,0px)) 18px 28px}
.login h1{font-family:Amiri,serif;font-size:1.9rem;line-height:1.35;margin:10px 0 2px;color:var(--ac);text-align:center}
.err{color:var(--bad);min-height:1.5em;font-size:.9rem}
.ok{color:var(--ok)}
.lnk{background:none;border:0;color:var(--ac);cursor:pointer;text-decoration:underline;padding:6px 0;display:block}
.x{background:none;border:1px solid var(--ln);border-radius:6px;color:var(--bad);cursor:pointer;padding:0 8px;flex:none;font-size:.82rem}
.low{color:var(--bad)}
.ltr{direction:ltr;text-align:right}
.cs{padding:8px 12px;border-radius:8px;text-align:center;font-weight:700;margin-bottom:10px;background:#d7f0e1;color:#14532d}
.cs.off{background:#f8d9d5;color:#7f1d1d}
.msgs{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;max-height:52vh;overflow:auto;padding:4px}
.m{max-width:85%;padding:8px 12px;border-radius:12px;background:var(--sf);border:1px solid var(--ln);align-self:flex-start}
.m.me{align-self:flex-end;background:var(--ac);color:#fff;border-color:var(--ac)}
:root[data-theme="dark"] .m.me{color:#06231d}
.m small{display:block;font-weight:700;opacity:.85;font-size:.74rem}
.cin{display:flex;gap:8px}.cin input{margin:0}.cin .btn{width:auto}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:12px;z-index:20;background:var(--tx);color:var(--bg);border-radius:10px;padding:10px 14px;display:none;max-width:600px;margin:0 auto}
.logo{width:116px;height:116px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 6px;background:#fff}
.hl{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#fff;flex:none}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px;text-align:center;cursor:pointer}
.stat strong{display:block;font-size:1.5rem;color:var(--ac);line-height:1.3}
.stat span{font-size:.78rem;color:var(--mu)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px 6px;text-align:center;cursor:pointer;font-weight:700}
.tile i{display:block;font-style:normal;font-size:1.7rem}
.tile:hover,.stat:hover{border-color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--ln);border-radius:20px;padding:3px 10px;background:var(--bg);cursor:pointer;font-size:.85rem;color:var(--tx);margin:0}
.chip input{width:auto;margin:0;accent-color:var(--ac)}
.grpt{font-weight:700;font-size:.82rem;color:var(--ac);margin:6px 0 4px;width:100%}
.tt{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.84rem}
th,td{border:1px solid var(--ln);padding:5px;text-align:center}
th{background:var(--soft)}
tr.today td,tr.today th{background:var(--warn);color:var(--warnt);font-weight:700}
td select{margin:0;padding:3px;font-size:.78rem;min-width:84px}
.notice{padding:10px 12px;border-radius:10px;background:var(--warn);color:var(--warnt);font-size:.86rem;line-height:1.7;margin-bottom:10px}
.urgent{border-inline-start:4px solid var(--bad)}
.att{display:flex;gap:4px}
.att button{border:1px solid var(--ln);background:var(--bg);border-radius:6px;padding:2px 8px;cursor:pointer;font-size:.8rem}
.att button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.att button.on.a{background:var(--bad);border-color:var(--bad)}
.att button.on.l{background:var(--ac2);border-color:var(--ac2);color:#2b1f00}
.dlgb{position:fixed;inset:0;background:#0008;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}.dlg{background:var(--sf);border-radius:14px;padding:16px;max-width:420px;width:100%;box-shadow:0 10px 30px #0005}.dlg textarea{min-height:140px;font-size:.75rem;direction:ltr}
.medal{font-size:1.3rem;width:30px;text-align:center;flex:none}
a{color:var(--ac)}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}

.dlgb{position:fixed;inset:0;background:#0008;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}.dlg{background:var(--sf);border-radius:14px;padding:16px;max-width:420px;width:100%;box-shadow:0 10px 30px #0005}.dlg textarea{min-height:140px;font-size:.75rem;direction:ltr}
.spin{width:38px;height:38px;border:4px solid var(--ln);border-top-color:var(--ac);border-radius:50%;animation:sp 1s linear infinite;margin:30px auto}@keyframes sp{to{transform:rotate(360deg)}}
.net{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom,0px));inset-inline:12px;background:var(--warn);color:var(--warnt);padding:6px 12px;border-radius:8px;font-size:.82rem;text-align:center;z-index:7;display:none}
ol.steps{padding-inline-start:20px;margin:0 0 10px}ol.steps li{margin-bottom:6px}
code{direction:ltr;unicode-bidi:embed;background:var(--soft);padding:0 4px;border-radius:4px;font-size:.85em}
</style>
</head>

/* ========= عامة ========= */
function setTab(t){tab=t;msg="";ttEdit=false;noRestore=true;draw();window.scrollTo(0,0)}
function del(col,id){ask("حذف هذا العنصر؟",function(){F.deleteDoc(F.doc(F.db,col,id)).catch(fail)})}
function myHw(){return D.hw.filter(function(w){return inScope(w.g)})}
function myNotes(){return D.notes.filter(function(n){return inScope(n.g)})}
function pendingHw(){return staff()?0:myHw().filter(function(w){return!ST.done[w.id]}).length}
function unreadNotes(){return myNotes().filter(function(x){return!ST.read[x.id]}).length}
function upcomingExams(){return D.exams.filter(function(x){return inScope(x.g)&&dd(x.date)>=0}).sort(function(a,b){return a.date<b.date?-1:1})}
function myAbs(k){return D.att.filter(function(x){return x.k===k}).length}
function avgOf(sid){var t=0,m=0;D.res.forEach(function(x){if(x.sid===sid){t+=x.v;m+=x.x}});return m?pct(t,m):null}
function todayIdx(){var d=new Date().getDay();return d<=4?d:-1}
function pendingStudents(){return staff()?students(curG()==="all"?null:curG(),true).filter(function(k){return!D.users[k].ok&&myG().indexOf(D.users[k].g)>=0}):[]}
